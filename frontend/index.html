<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synovae — Find jobs near you</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <script src="/assets/js/seo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/landing.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f4ff',
                            500: '#667eea',
                            600: '#5a67d8',
                            700: '#4c51bf'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="mkt-page font-sans">
    <div id="public-navbar-container"></div>

    <header class="mkt-hero mkt-hero-jobs">
        <div class="mkt-wrap">
            <div class="mkt-jobs-bar">
                <div>
                    <p class="mkt-kicker"><span class="mkt-dot"></span> Open roles near <span id="hero-location-name">you</span></p>
                    <h1 class="mkt-jobs-title">Jobs</h1>
                </div>
                <button type="button" id="nav-upload-btn" class="mkt-btn btn-gradient text-white">Upload CV</button>
            </div>

            <div id="search-section" class="mkt-search">
                <label class="mkt-field">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="landing-search-query" placeholder="Job title, keyword, or company" aria-label="Job title, keyword, or company">
                </label>
                <label class="mkt-field">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <input type="text" id="landing-search-location" placeholder="City, country, or Remote" aria-label="Location">
                </label>
                <button id="landing-search-btn" class="mkt-submit btn-gradient" type="button">Search jobs</button>
            </div>
            <div class="mkt-chips" aria-label="Popular searches">
                <button type="button" data-search-query="Software Engineer">Engineering</button>
                <button type="button" data-search-query="Product Designer">Design</button>
                <button type="button" data-search-query="Registered Nurse">Healthcare</button>
                <button type="button" data-search-query="Data Analyst">Data</button>
                <button type="button" data-search-query="Customer Support">Support</button>
            </div>
        </div>
    </header>

    <section id="jobs-wrapper" class="mkt-board">
        <div class="mkt-wrap">
            <div class="mkt-board-head">
                <div>
                    <p class="mkt-kicker" style="margin-bottom:0">Fresh roles</p>
                    <h2>Latest opportunities</h2>
                </div>
                <button id="btn-jobs-near-me" class="mkt-near" type="button">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Jobs near me
                </button>
            </div>
            <div id="jobs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
                <div class="skeleton-job-card h-[260px]"></div>
            </div>
        </div>
    </section>

    <div id="cv-upload-modal" class="mkt-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="mkt-modal-backdrop" id="modal-backdrop"></div>
        <div class="mkt-modal-dialog">
            <div class="mkt-panel">
                <button type="button" id="close-modal-btn" class="mkt-close" aria-label="Close">×</button>
                <h3 id="modal-title">Upload your CV</h3>
                <p class="mkt-panel-copy">We keep the file on this device until you sign in, then match it to these jobs.</p>
                <div id="cv-upload-zone" class="mkt-drop">
                    <strong>Drop a file or click to browse</strong>
                    <span>PDF, DOCX, or TXT, up to 10MB</span>
                </div>
                <input type="file" id="cv-file-input" accept=".pdf,.docx,.doc,.txt">
                <div id="preferences-container" class="hidden opacity-0 translate-y-4 space-y-3 mt-4">
                    <div>
                        <label class="mkt-label" for="job-title">Desired title</label>
                        <input type="text" id="job-title" class="mkt-input" placeholder="e.g. Product designer">
                    </div>
                    <div>
                        <label class="mkt-label" for="location">Location</label>
                        <input type="text" id="location" class="mkt-input" placeholder="e.g. Remote">
                    </div>
                    <div>
                        <label class="mkt-label" for="salary-range">Salary range</label>
                        <select id="salary-range">
                            <option value="">Select range</option>
                            <option value="40-60k">$40k – $60k</option>
                            <option value="60-80k">$60k – $80k</option>
                            <option value="80-100k">$80k – $100k</option>
                            <option value="100-120k">$100k – $120k</option>
                            <option value="120k+">$120k+</option>
                        </select>
                    </div>
                    <button id="get-started-btn" class="mkt-btn btn-gradient text-white w-full mt-2" type="button" disabled>Analyze and match</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/assets/js/utils/geolocation.js"></script>
    <script src="/assets/js/utils/pending-cv.js"></script>
    <script src="/assets/js/utils/currency.js"></script>
    <script src="/assets/js/utils/cache.js"></script>
    <script src="/assets/js/components/PublicNavbar.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/components/JobModal.js"></script>
    <script src="/assets/js/components/JobCard.js"></script>
    <script src="/assets/js/landing.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            if (window.CVision && window.CVision.Geolocation) {
                const data = await CVision.Geolocation.detect();
                if (data.detected) {
                    const loc = data.city || data.countryName;
                    const heroLoc = document.getElementById('hero-location-name');
                    if (heroLoc) heroLoc.textContent = loc;
                }
            }
        });
    </script>
</body>

</html>
