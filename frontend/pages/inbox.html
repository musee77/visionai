<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - JobsApply</title>
    <script src="/assets/js/auth-guard.js?v=1.2"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
    <div id="navbar-container"></div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Inbox</h1>
            <p class="text-gray-600">Write to support. Replies from the admin team appear in this chat.</p>
        </div>

        <form id="inboxStartForm" class="bg-white rounded-xl border border-gray-200 p-6 mb-4 space-y-3">
            <label for="inboxStart" class="block text-sm font-medium text-gray-700">New message</label>
            <textarea id="inboxStart" rows="3" required placeholder="Write a message..."
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            <div class="flex justify-end">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Send</button>
            </div>
        </form>

        <div id="inboxList" class="space-y-3"></div>

        <section id="inboxThread" class="hidden bg-white rounded-xl border border-gray-200">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <button type="button" id="inboxBack" class="text-sm text-gray-600 hover:text-gray-900">All messages</button>
                <span id="inboxStatus" class="text-xs font-medium uppercase text-gray-500"></span>
            </div>
            <div id="inboxMessages" class="px-6 py-4 space-y-4"></div>
            <form id="inboxReplyForm" class="px-6 py-4 border-t space-y-3">
                <label for="inboxReply" class="block text-sm font-medium text-gray-700">Reply</label>
                <textarea id="inboxReply" rows="4" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Send</button>
                </div>
            </form>
        </section>
    </main>

    <script src="/assets/js/main.js?v=1.3"></script>
    <script src="/assets/js/pages/inbox.js?v=2"></script>
    <script src="/assets/js/components/navbar.js?v=1.7" defer></script>
    <script>
        fetch('/components/navbar.html?v=1.9')
            .then((response) => response.text())
            .then((html) => {
                document.getElementById('navbar-container').innerHTML = html;
                if (window.CVisionNavbar) CVisionNavbar.init('Inbox');
            });
    </script>
</body>

</html>
