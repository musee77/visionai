<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog post - JobsApply admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=3">
</head>

<body class="bg-gray-50">
    <div class="admin-shell flex h-screen overflow-hidden">
        <div id="admin-sidebar"></div>
        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
                <div class="px-4 sm:px-6 py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <a href="blog-admin" class="text-sm text-blue-600 hover:text-blue-800">Blog</a>
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 break-words" id="pageTitle">Blog post</h2>
                    </div>
                    <button type="button" id="deleteBtn" class="hidden self-start sm:self-auto shrink-0 px-4 py-2 text-sm text-red-700 border border-red-200 rounded-lg hover:bg-red-50">Delete</button>
                </div>
            </header>
            <div class="p-4 sm:p-6 max-w-3xl">
                <p id="pageError" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm"></p>
                <form id="postForm" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 space-y-4">
                    <label class="block text-sm">Title
                        <input id="title" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <label class="block text-sm">Slug
                        <input id="slug" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <label class="block text-sm">Excerpt
                        <textarea id="excerpt" rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                    </label>
                    <label class="block text-sm">Content
                        <textarea id="content" rows="12" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg font-mono text-sm"></textarea>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="block text-sm">Categories
                            <input id="categories" placeholder="career, resume" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                        <label class="block text-sm">Tags
                            <input id="tags" placeholder="cv, interview" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                    </div>
                    <label class="block text-sm">Featured image URL
                        <input id="image" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <label class="block text-sm">Status
                        <select id="status" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                            <option value="archived">Archived</option>
                        </select>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="block text-sm">SEO title
                            <input id="seoTitle" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                        <label class="block text-sm">SEO keywords
                            <input id="seoKeywords" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                    </div>
                    <label class="block text-sm">SEO description
                        <textarea id="seoDescription" rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                    </label>
                    <p id="meta" class="text-sm text-gray-500"></p>
                    <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
                </form>
            </div>
        </main>
    </div>
    <script src="/admin/assets/js/admin-sidebar.js?v=4"></script>
    <script src="/assets/js/main.js?v=1.3"></script>
    <script>
        if (!CVision.Utils.isAuthenticated()) window.location.href = 'login.html';
        const postId = new URLSearchParams(window.location.search).get('id');
        let slugTouched = false;

        function showError(error) {
            const box = document.getElementById('pageError');
            box.textContent = error.detail || error.message || 'Something went wrong';
            box.classList.remove('hidden');
        }

        function listValue(value) {
            return String(value || '').split(',').map((item) => item.trim()).filter(Boolean);
        }

        function payload() {
            return {
                title: document.getElementById('title').value.trim(),
                slug: document.getElementById('slug').value.trim() || null,
                excerpt: document.getElementById('excerpt').value.trim() || null,
                content: document.getElementById('content').value,
                categories: listValue(document.getElementById('categories').value),
                tags: listValue(document.getElementById('tags').value),
                featured_image: document.getElementById('image').value.trim() || null,
                status: document.getElementById('status').value,
                seo: {
                    meta_title: document.getElementById('seoTitle').value.trim() || null,
                    meta_description: document.getElementById('seoDescription').value.trim() || null,
                    keywords: listValue(document.getElementById('seoKeywords').value)
                }
            };
        }

        function fill(post) {
            document.getElementById('pageTitle').textContent = post.title || 'Blog post';
            document.getElementById('title').value = post.title || '';
            document.getElementById('slug').value = post.slug || '';
            document.getElementById('excerpt').value = post.excerpt || '';
            document.getElementById('content').value = post.content || '';
            document.getElementById('categories').value = (post.categories || []).join(', ');
            document.getElementById('tags').value = (post.tags || []).join(', ');
            document.getElementById('image').value = post.featured_image || '';
            document.getElementById('status').value = post.status || 'draft';
            const seo = post.seo || {};
            document.getElementById('seoTitle').value = seo.meta_title || '';
            document.getElementById('seoDescription').value = seo.meta_description || '';
            document.getElementById('seoKeywords').value = (seo.keywords || []).join(', ');
            document.getElementById('meta').textContent = `${post.views || 0} views`;
            slugTouched = true;
        }

        document.getElementById('title').addEventListener('input', () => {
            if (slugTouched) return;
            document.getElementById('slug').value = document.getElementById('title').value
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/[\s_-]+/g, '-')
                .replace(/^-+|-+$/g, '');
        });
        document.getElementById('slug').addEventListener('input', () => { slugTouched = true; });

        document.getElementById('postForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            document.getElementById('pageError').classList.add('hidden');
            try {
                if (!postId) {
                    const created = await CVision.API.request('/blog/posts', {
                        method: 'POST',
                        body: JSON.stringify(payload())
                    });
                    window.location.href = `post.html?id=${encodeURIComponent(created.id)}`;
                    return;
                }
                await CVision.API.request(`/blog/posts/${postId}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload())
                });
                fill(await CVision.API.request(`/blog/posts/${postId}`));
            } catch (error) {
                showError(error);
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!confirm('Delete this post?')) return;
            try {
                await CVision.API.request(`/blog/posts/${postId}`, { method: 'DELETE' });
                window.location.href = 'blog-admin';
            } catch (error) {
                showError(error);
            }
        });

        if (!postId) {
            document.getElementById('pageTitle').textContent = 'New post';
        } else {
            document.getElementById('deleteBtn').classList.remove('hidden');
            CVision.API.request(`/blog/posts/${postId}`).then(fill).catch(showError);
        }
    </script>
</body>

</html>
