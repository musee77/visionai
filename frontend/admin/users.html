<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - synovae admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=2">
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div id="admin-sidebar"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
                <div class="px-4 sm:px-6 py-4 flex justify-between items-center">
                    <h2 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-900">Users</h2>
                    <div class="flex items-center gap-4">
                        <button onclick="openCreateModal()"
                            class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            New User
                        </button>
                        <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-900">Logout</button>
                    </div>
                </div>
            </header>

            <div class="p-4 sm:p-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div class="text-gray-500 text-sm font-medium mb-1">Total Users</div>
                        <div id="stat-total" class="text-3xl font-bold text-gray-900">-</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div class="text-green-600 text-sm font-medium mb-1">Active Users</div>
                        <div id="stat-active" class="text-3xl font-bold text-gray-900">-</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div class="text-yellow-600 text-sm font-medium mb-1">Premium Users</div>
                        <div id="stat-premium" class="text-3xl font-bold text-gray-900">-</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div class="text-blue-600 text-sm font-medium mb-1">Free Users</div>
                        <div id="stat-free" class="text-3xl font-bold text-gray-900">-</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-white rounded-lg p-4 mb-6 shadow-sm">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
                        <input type="text" id="searchInput" placeholder="Search users..."
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">

                        <select id="tierFilter"
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">All Tiers</option>
                            <option value="free">Free</option>
                            <option value="basic">Basic</option>
                            <option value="premium">Premium</option>
                        </select>

                        <select id="statusFilter"
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">All Status</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>

                        <select id="verifiedFilter"
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">All verification</option>
                            <option value="true">Verified</option>
                            <option value="false">Unverified</option>
                        </select>

                        <button onclick="applyFilters()"
                            class="px-3 sm:px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            Apply Filters
                        </button>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        User</th>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Tier</th>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden sm:table-cell">
                                        Status</th>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden lg:table-cell">
                                        Verified</th>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">
                                        Created</th>
                                    <th
                                        class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="6" class="px-4 sm:px-6 py-4 text-center text-gray-500 text-sm">
                                        Loading users...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="text-xs sm:text-sm text-gray-600 text-center sm:text-left">
                        Showing <span id="showingFrom">0</span> to <span id="showingTo">0</span> of <span
                            id="totalUsers">0</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="previousPage()" id="prevBtn"
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                            <span class="hidden sm:inline">Previous</span>
                            <span class="sm:hidden">Prev</span>
                        </button>
                        <span class="px-2 sm:px-4 py-2 text-xs sm:text-sm text-gray-700">
                            <span id="currentPage">1</span>/<span id="totalPages">1</span>
                        </span>
                        <button onclick="nextPage()" id="nextBtn"
                            class="px-3 sm:px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                            Next
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-4 sm:p-6 max-w-md w-full">
            <h3 class="text-lg sm:text-xl font-bold mb-4">Edit User</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" id="editFirstName"
                            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="editLastName"
                            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="text" id="editEmail" readonly
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subscription Tier</label>
                    <select id="editTier" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                        <option value="free">Free</option>
                        <option value="basic">Basic</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                    <select id="editRole" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="editStatus" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex flex-col sm:flex-row justify-end gap-3">
                <button onclick="closeEditModal()"
                    class="w-full sm:w-auto px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancel
                </button>
                <button onclick="saveUserChanges()"
                    class="w-full sm:w-auto px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Create User Modal -->
    <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-4 sm:p-6 max-w-md w-full">
            <h3 class="text-lg sm:text-xl font-bold mb-4">Create New User</h3>
            <form id="createUserForm" onsubmit="createUser(event)">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                            <input type="text" id="createFirstName" required
                                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                            <input type="text" id="createLastName" required
                                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="createEmail" required
                            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="createPassword" required minlength="8"
                            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg"
                            placeholder="Min 8 chars, 1 Upper, 1 Lower, 1 Number">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                            <select id="createRole" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tier</label>
                            <select id="createTier" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                                <option value="free">Free</option>
                                <option value="basic">Basic</option>
                                <option value="premium">Premium</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="mt-6 flex flex-col sm:flex-row justify-end gap-3">
                    <button type="button" onclick="closeCreateModal()"
                        class="w-full sm:w-auto px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
                    <button type="submit"
                        class="w-full sm:w-auto px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Create
                        User</button>
                </div>
            </form>
        </div>
    </div>

    <div id="profileModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-lg max-w-3xl w-full mx-auto my-6">
            <div class="px-4 sm:px-6 py-4 border-b border-gray-200 flex items-start justify-between gap-4">
                <div>
                    <h3 id="profileTitle" class="text-lg sm:text-xl font-bold text-gray-900">Profile</h3>
                    <p id="profileEmail" class="text-sm text-gray-500"></p>
                </div>
                <button type="button" onclick="closeProfile()" class="text-sm text-gray-500 hover:text-gray-800">Close</button>
            </div>
            <div id="profileBody" class="px-4 sm:px-6 py-5 text-sm text-gray-700"></div>
        </div>
    </div>

    <script src="/admin/assets/js/admin-sidebar.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        let currentPage = 1;
        let currentUserId = null;

        if (!CVision.Utils.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        async function loadUsers(page = 1) {
            try {
                const search = document.getElementById('searchInput').value;
                const tier = document.getElementById('tierFilter').value;
                const status = document.getElementById('statusFilter').value;
                const verified = document.getElementById('verifiedFilter').value;

                let endpoint = `/admin/users?page=${page}&limit=20`;
                if (search) endpoint += `&search=${encodeURIComponent(search)}`;
                if (tier) endpoint += `&tier=${tier}`;
                if (status) endpoint += `&is_active=${status}`;
                if (verified) endpoint += `&is_verified=${verified}`;

                const data = await CVision.API.request(endpoint);
                displayUsers(data.users);
                updatePagination(data);
                currentPage = page;

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('usersTableBody').innerHTML = `
                    <tr><td colspan="6" class="px-4 sm:px-6 py-4 text-center text-red-500 text-sm">Failed to load users</td></tr>
                `;
            }
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function formatWhen(value) {
            if (!value) return '—';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString();
        }

        function displayUsers(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 sm:px-6 py-4 text-center text-gray-500 text-sm">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 sm:px-6 py-4">
                        <div class="flex items-center min-w-0">
                            <div class="w-8 h-8 sm:w-10 sm:h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 font-medium text-sm flex-shrink-0">
                                ${esc(user.first_name ? user.first_name[0].toUpperCase() : 'U')}
                            </div>
                            <div class="ml-3 min-w-0">
                                <div class="text-xs sm:text-sm font-medium text-gray-900 truncate">${esc(user.first_name || '')} ${esc(user.last_name || '')}</div>
                                <div class="text-xs text-gray-500 truncate">${esc(user.email)}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                        <span class="px-2 py-1 inline-flex text-xs font-semibold rounded-full 
                            ${user.subscription_tier === 'premium' ? 'bg-yellow-100 text-yellow-800' :
                    user.subscription_tier === 'basic' ? 'bg-blue-100 text-blue-800' :
                        'bg-gray-100 text-gray-800'}">
                            ${esc(user.subscription_tier)}
                        </span>
                    </td>
                    <td class="px-4 sm:px-6 py-4 hidden sm:table-cell">
                        <span class="px-2 py-1 inline-flex text-xs font-semibold rounded-full 
                            ${user.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-4 sm:px-6 py-4 hidden lg:table-cell">
                        <span class="px-2 py-1 inline-flex text-xs font-semibold rounded-full ${user.is_verified ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                            ${user.is_verified ? 'Verified' : 'Unverified'}
                        </span>
                    </td>
                    <td class="px-4 sm:px-6 py-4 text-xs sm:text-sm text-gray-500 hidden md:table-cell">
                        ${user.created_at ? new Date(user.created_at).toLocaleDateString() : '—'}
                    </td>
                    <td class="px-4 sm:px-6 py-4 text-xs sm:text-sm font-medium">
                        <div class="flex flex-wrap gap-x-3 gap-y-1">
                            <button onclick="viewProfile('${esc(user.id)}')" class="text-gray-700 hover:text-gray-900">View</button>
                            ${user.is_verified ? '' : `<button onclick="setVerified('${esc(user.id)}', true)" class="text-emerald-700 hover:text-emerald-900">Verify</button>`}
                            <button onclick="editUser('${esc(user.id)}')" class="text-blue-600 hover:text-blue-900">Edit</button>
                            <button onclick="deleteUser('${esc(user.id)}')" class="text-red-600 hover:text-red-900">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updatePagination(data) {
            document.getElementById('showingFrom').textContent = data.users.length > 0 ? (data.page - 1) * 20 + 1 : 0;
            document.getElementById('showingTo').textContent = (data.page - 1) * 20 + data.users.length;
            document.getElementById('totalUsers').textContent = data.total;
            document.getElementById('currentPage').textContent = data.page;
            document.getElementById('totalPages').textContent = data.pages;

            document.getElementById('prevBtn').disabled = data.page <= 1;
            document.getElementById('nextBtn').disabled = data.page >= data.pages;
        }

        async function editUser(userId) {
            try {
                // Using the specific admin endpoint to get full details might catch more info
                const user = await CVision.API.request(`/admin/users/${userId}`);
                currentUserId = userId;

                document.getElementById('editFirstName').value = user.first_name || '';
                document.getElementById('editLastName').value = user.last_name || '';
                document.getElementById('editEmail').value = user.email;
                document.getElementById('editTier').value = user.subscription_tier;
                document.getElementById('editRole').value = user.role || 'user';
                document.getElementById('editStatus').value = user.is_active;
                document.getElementById('editModal').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('Failed to load user details');
            }
        }

        async function saveUserChanges() {
            try {
                const firstName = document.getElementById('editFirstName').value;
                const lastName = document.getElementById('editLastName').value;
                const tier = document.getElementById('editTier').value;
                const isActive = document.getElementById('editStatus').value === 'true';

                // 1. Update Profile Fields (PUT /users/{id})
                // Note: The /users/{id} endpoint from users.py handles name updates
                await CVision.API.request(`/users/${currentUserId}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                // 2. Update Tier (PATCH /admin/users/{id}/tier)
                await CVision.API.request(`/admin/users/${currentUserId}/tier`, {
                    method: 'PATCH',
                    body: JSON.stringify({ tier })
                });

                // 3. Update Status (PATCH /admin/users/{id}/status)
                await CVision.API.request(`/admin/users/${currentUserId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_active: isActive })
                });

                closeEditModal();
                loadUsers(currentPage);
                loadStats();
                alert('User updated successfully');

            } catch (error) {
                console.error(error);
                alert('Failed to update user: ' + (error.detail || error.message || 'Unknown error'));
            }
        }

        function openCreateModal() {
            document.getElementById('createUserForm').reset();
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
        }

        async function createUser(event) {
            event.preventDefault();
            try {
                const data = {
                    first_name: document.getElementById('createFirstName').value,
                    last_name: document.getElementById('createLastName').value,
                    email: document.getElementById('createEmail').value,
                    password: document.getElementById('createPassword').value,
                    role: document.getElementById('createRole').value,
                    tier: document.getElementById('createTier').value,
                    is_verified: true,
                    terms_accepted: true
                };

                // Use the new endpoint implemented: POST /users/ (admin only)
                // Passing role/tier as query params or if I updated the prompt to body? 
                // Checks python code: args are query params or body? default behavior for Pydantic/FastAPI mixed:
                // user_in is Body, role/tier/is_verified are Query params by default in FastAPI unless Body() is used.
                // Let's assume proper query params construction:

                let url = `/users/?role=${data.role}&tier=${data.tier}&is_verified=true`;

                await CVision.API.request(url, {
                    method: 'POST',
                    body: JSON.stringify({
                        first_name: data.first_name,
                        last_name: data.last_name,
                        email: data.email,
                        password: data.password,
                        terms_accepted: true
                    })
                });

                closeCreateModal();
                loadUsers(1);
                loadStats();
                alert('User created successfully');

            } catch (error) {
                console.error(error);
                alert('Failed to create user: ' + (error.detail || error.message));
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentUserId = null;
        }

        function closeProfile() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function profileLine(label, value) {
            return `<div><div class="text-xs uppercase tracking-wide text-gray-400">${label}</div><div class="mt-1 text-gray-900">${value || '—'}</div></div>`;
        }

        function renderProfile(user) {
            const location = [user.location?.city, user.location?.state, user.location?.country].filter(Boolean).join(', ');
            const counts = user.referral_counts || {};
            const referredBy = user.referred_by
                ? `${esc(user.referred_by.name || user.referred_by.email)} · ${esc(user.referred_by.email)} · ${esc(user.referred_by.referral_code || '')}`
                : 'Signed up without a referral link';
            const subscription = user.subscription
                ? `${esc(user.subscription.plan_id || 'Plan')} · ${esc(user.subscription.status || '')} · ${esc(user.subscription.billing_interval || '')}`
                : 'No billing record';
            const referrals = (user.referrals || []).map(ref => `
                <tr class="border-t border-gray-100">
                    <td class="py-2 pr-3">${esc(ref.referee_name || '—')}<div class="text-xs text-gray-500">${esc(ref.referee_email)}</div></td>
                    <td class="py-2 pr-3">${esc(ref.subscription_tier || '—')}</td>
                    <td class="py-2 pr-3">${esc(ref.status)}</td>
                    <td class="py-2">${esc(formatWhen(ref.referred_at))}</td>
                </tr>
            `).join('');

            document.getElementById('profileTitle').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email;
            document.getElementById('profileEmail').textContent = user.email || '';
            document.getElementById('profileBody').innerHTML = `
                <div class="flex flex-wrap items-center gap-2 mb-5">
                    <span class="px-2 py-1 text-xs font-semibold rounded-full ${user.is_verified ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${user.is_verified ? 'Verified' : 'Unverified'}</span>
                    <span class="px-2 py-1 text-xs font-semibold rounded-full ${user.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${user.is_active ? 'Active' : 'Inactive'}</span>
                    <span class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">${esc(user.subscription_tier)}</span>
                    <button type="button" onclick="setVerified('${esc(user.id)}', ${user.is_verified ? 'false' : 'true'}, true)"
                        class="ml-auto px-3 py-1.5 text-xs bg-emerald-700 text-white rounded-lg hover:bg-emerald-800">
                        ${user.is_verified ? 'Mark unverified' : 'Verify email'}
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    ${profileLine('Phone', esc(user.phone))}
                    ${profileLine('Role', esc(user.role))}
                    ${profileLine('Joined', esc(formatWhen(user.created_at)))}
                    ${profileLine('Last login', esc(formatWhen(user.last_login)))}
                    ${profileLine('Verified at', esc(formatWhen(user.verified_at)))}
                    ${profileLine('Job location', esc(location))}
                    ${profileLine('Referral code', esc(user.referral_code))}
                    ${profileLine('Automated apps from referrals', esc(user.referral_bonus_auto_applications))}
                    ${profileLine('Gmail', user.gmail_connected ? 'Connected' : 'Not connected')}
                    ${profileLine('Documents', esc(user.document_count))}
                    ${profileLine('Applications', esc(user.application_count))}
                    ${profileLine('Billing', subscription)}
                </div>
                <div class="mb-6">
                    <h4 class="font-semibold text-gray-900 mb-2">Referred by</h4>
                    <p>${referredBy}</p>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-900 mb-1">Referrals</h4>
                    <p class="text-gray-500 mb-3">${counts.total || 0} total · ${counts.pending || 0} waiting for a paid plan · ${counts.completed || 0} rewarded</p>
                    ${(counts.total || 0) > (user.referrals || []).length ? '<p class="text-xs text-gray-400 mb-2">Showing the latest 50.</p>' : ''}
                    ${referrals ? `<div class="overflow-x-auto"><table class="min-w-full text-sm"><thead><tr class="text-left text-xs uppercase text-gray-400"><th class="pb-2 pr-3">Person</th><th class="pb-2 pr-3">Plan</th><th class="pb-2 pr-3">Status</th><th class="pb-2">Signed up</th></tr></thead><tbody>${referrals}</tbody></table></div>` : '<p class="text-gray-500">No referrals yet.</p>'}
                </div>
            `;
        }

        async function viewProfile(userId) {
            try {
                const user = await CVision.API.request(`/admin/users/${userId}`);
                renderProfile(user);
                document.getElementById('profileModal').classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert('Failed to load profile');
            }
        }

        async function setVerified(userId, verified, refreshProfile = false) {
            try {
                await CVision.API.request(`/admin/users/${userId}/verify`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_verified: verified })
                });
                await loadUsers(currentPage);
                if (refreshProfile) await viewProfile(userId);
            } catch (error) {
                console.error(error);
                alert('Failed to update verification');
            }
        }

        function applyFilters() {
            loadUsers(1);
        }

        function previousPage() {
            if (currentPage > 1) loadUsers(currentPage - 1);
        }

        function nextPage() {
            loadUsers(currentPage + 1);
        }

        async function createMockUsers() {
            // Implementation for mock users if needed, or remove
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
                return;
            }

            try {
                await CVision.API.request(`/admin/users/${userId}`, {
                    method: 'DELETE'
                });
                alert('User deleted successfully');
                loadUsers(currentPage);
                loadStats();
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user');
            }
        }

        async function loadStats() {
            try {
                // We use the platform stats endpoint available in admin.py
                const stats = await CVision.API.request('/admin/stats');

                document.getElementById('stat-total').textContent = stats.total_users;
                document.getElementById('stat-active').textContent = stats.active_users;

                // Tier counts map (free, basic, premium)
                const tiers = stats.users_by_tier || {};
                document.getElementById('stat-premium').textContent = tiers.premium || 0;
                document.getElementById('stat-free').textContent = (tiers.free || 0) + (tiers.basic || 0); // Group Basic/Free for this UI or separate if needed

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }


        loadUsers();
        loadStats();
    </script>
</body>

</html>
