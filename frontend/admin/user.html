<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - JobsApply admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=3">
</head>

<body class="bg-gray-50">
    <div class="admin-shell flex h-screen overflow-hidden">
        <div id="admin-sidebar"></div>
        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
                <div class="px-4 sm:px-6 py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <a href="users" class="text-sm text-blue-600 hover:text-blue-800">Users</a>
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 break-words" id="pageTitle">User</h2>
                    </div>
                    <button type="button" id="deleteBtn" class="hidden self-start sm:self-auto shrink-0 px-4 py-2 text-sm text-red-700 border border-red-200 rounded-lg hover:bg-red-50">Delete</button>
                </div>
            </header>
            <div class="p-4 sm:p-6 max-w-4xl">
                <p id="pageError" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm"></p>
                <form id="userForm" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="block text-sm">First name
                            <input id="firstName" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                        <label class="block text-sm">Last name
                            <input id="lastName" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </label>
                    </div>
                    <label class="block text-sm">Email
                        <input id="email" type="email" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <label id="passwordField" class="block text-sm">Password
                        <input id="password" type="password" minlength="8" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <label class="block text-sm">Plan
                            <select id="tier" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="free">Free</option>
                                <option value="basic">Basic</option>
                                <option value="premium">Premium</option>
                            </select>
                        </label>
                        <label class="block text-sm">Role
                            <select id="role" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="user">User</option>
                                <option value="moderator">Moderator</option>
                                <option value="admin">Admin</option>
                            </select>
                        </label>
                        <label class="block text-sm">Status
                            <select id="status" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </label>
                    </div>
                    <label id="verifiedField" class="hidden items-center gap-2 text-sm">
                        <input id="verified" type="checkbox" class="rounded">
                        Email verified
                    </label>
                    <div id="facts" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-gray-600"></div>
                    <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
                </form>
                <section id="referrals" class="hidden mt-6 bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6">
                    <h3 class="text-lg font-semibold text-gray-900">Referrals</h3>
                    <p id="referredBy" class="text-sm text-gray-600 mt-2"></p>
                    <p id="referralCounts" class="text-sm text-gray-500 mt-1"></p>
                    <div id="referralTable" class="mt-4 overflow-x-auto"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="/admin/assets/js/admin-sidebar.js?v=4"></script>
    <script src="/assets/js/main.js?v=1.3"></script>
    <script>
        if (!CVision.Utils.isAuthenticated()) window.location.href = 'login.html';
        const userId = new URLSearchParams(window.location.search).get('id');
        const creating = !userId;

        function showError(error) {
            const box = document.getElementById('pageError');
            box.textContent = error.detail || error.message || 'Something went wrong';
            box.classList.remove('hidden');
        }

        function fact(label, value) {
            return `<div><div class="text-xs uppercase tracking-wide text-gray-400">${label}</div><div class="text-gray-900 mt-1">${value || '—'}</div></div>`;
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        function when(value) {
            if (!value) return '—';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString();
        }

        function fillReferrals(user) {
            const section = document.getElementById('referrals');
            const counts = user.referral_counts || {};
            const referredBy = user.referred_by;
            document.getElementById('referredBy').innerHTML = referredBy
                ? `Referred by <a class="text-blue-600 hover:text-blue-800" href="user.html?id=${encodeURIComponent(referredBy.id)}">${escapeHtml(referredBy.name || referredBy.email)}</a> · ${escapeHtml(referredBy.email)}`
                : 'Signed up without a referral link';
            document.getElementById('referralCounts').textContent = `${counts.total || 0} total · ${counts.pending || 0} waiting for a paid plan · ${counts.completed || 0} rewarded · ${user.referral_bonus_auto_applications || 0} automated applications left`;
            const rows = (user.referrals || []).map((ref) => {
                const person = ref.referee_id
                    ? `<a class="text-blue-600 hover:text-blue-800" href="user.html?id=${encodeURIComponent(ref.referee_id)}">${escapeHtml(ref.referee_name || ref.referee_email || 'User')}</a>`
                    : escapeHtml(ref.referee_name || ref.referee_email || '—');
                return `<tr class="border-t border-gray-100">
                    <td class="py-2 pr-3">${person}<div class="text-xs text-gray-500">${escapeHtml(ref.referee_email)}</div></td>
                    <td class="py-2 pr-3">${escapeHtml(ref.subscription_tier || '—')}</td>
                    <td class="py-2 pr-3">${escapeHtml(ref.status)}</td>
                    <td class="py-2">${escapeHtml(when(ref.referred_at))}</td>
                </tr>`;
            }).join('');
            document.getElementById('referralTable').innerHTML = rows
                ? `<table class="admin-detail-table min-w-full text-sm"><thead><tr class="text-left text-xs uppercase text-gray-400"><th class="pb-2 pr-3">Person</th><th class="pb-2 pr-3">Plan</th><th class="pb-2 pr-3">Status</th><th class="pb-2">Signed up</th></tr></thead><tbody>${rows}</tbody></table>${(counts.total || 0) > (user.referrals || []).length ? '<p class="text-xs text-gray-400 mt-2">Showing the latest 50.</p>' : ''}`
                : '<p class="text-sm text-gray-500">No referrals yet.</p>';
            section.classList.remove('hidden');
        }

        function fillUser(user) {
            document.getElementById('pageTitle').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email;
            document.getElementById('firstName').value = user.first_name || '';
            document.getElementById('lastName').value = user.last_name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('email').readOnly = true;
            document.getElementById('tier').value = user.subscription_tier || 'free';
            document.getElementById('role').value = user.role || 'user';
            document.getElementById('status').value = user.is_active ? 'true' : 'false';
            document.getElementById('verified').checked = !!user.is_verified;
            const location = [user.location && user.location.city, user.location && user.location.country].filter(Boolean).join(', ');
            document.getElementById('facts').innerHTML = [
                fact('Phone', user.phone),
                fact('Joined', user.created_at ? new Date(user.created_at).toLocaleString() : ''),
                fact('Last login', user.last_login ? new Date(user.last_login).toLocaleString() : ''),
                fact('Job location', location),
                fact('Documents', user.document_count),
                fact('Applications', user.application_count),
                fact('Referral code', user.referral_code),
                fact('Gmail', user.gmail_connected ? 'Connected' : 'Not connected')
            ].join('');
            document.getElementById('facts').classList.remove('hidden');
            document.getElementById('facts').classList.add('grid');
            fillReferrals(user);
        }

        async function loadUser() {
            const user = await CVision.API.request(`/admin/users/${userId}`);
            fillUser(user);
        }

        document.getElementById('userForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            document.getElementById('pageError').classList.add('hidden');
            try {
                if (creating) {
                    const role = document.getElementById('role').value;
                    const tier = document.getElementById('tier').value;
                    await CVision.API.request(`/users/?role=${encodeURIComponent(role)}&tier=${encodeURIComponent(tier)}&is_verified=true`, {
                        method: 'POST',
                        body: JSON.stringify({
                            first_name: document.getElementById('firstName').value,
                            last_name: document.getElementById('lastName').value,
                            email: document.getElementById('email').value,
                            password: document.getElementById('password').value,
                            terms_accepted: true
                        })
                    });
                    window.location.href = 'users';
                    return;
                }
                await CVision.API.request(`/users/${userId}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        first_name: document.getElementById('firstName').value,
                        last_name: document.getElementById('lastName').value
                    })
                });
                await CVision.API.request(`/admin/users/${userId}/tier`, {
                    method: 'PATCH',
                    body: JSON.stringify({ tier: document.getElementById('tier').value })
                });
                await CVision.API.request(`/admin/users/${userId}/role`, {
                    method: 'PATCH',
                    body: JSON.stringify({ role: document.getElementById('role').value })
                });
                await CVision.API.request(`/admin/users/${userId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_active: document.getElementById('status').value === 'true' })
                });
                await CVision.API.request(`/admin/users/${userId}/verify`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_verified: document.getElementById('verified').checked })
                });
                await loadUser();
            } catch (error) {
                showError(error);
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!confirm('Delete this user? This cannot be undone.')) return;
            try {
                await CVision.API.request(`/admin/users/${userId}`, { method: 'DELETE' });
                window.location.href = 'users';
            } catch (error) {
                showError(error);
            }
        });

        if (creating) {
            document.getElementById('pageTitle').textContent = 'New user';
            document.getElementById('password').required = true;
        } else {
            document.getElementById('passwordField').classList.add('hidden');
            document.getElementById('verifiedField').classList.remove('hidden');
            document.getElementById('verifiedField').classList.add('flex');
            document.getElementById('deleteBtn').classList.remove('hidden');
            loadUser().catch(showError);
        }
    </script>
</body>

</html>
