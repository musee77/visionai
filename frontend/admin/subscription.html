<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription - JobsApply admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=3">
</head>

<body class="bg-gray-50">
    <div class="admin-shell flex h-screen overflow-hidden">
        <div id="admin-sidebar"></div>
        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
                <div class="px-4 sm:px-6 py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <a href="subscriptions" class="text-sm text-blue-600 hover:text-blue-800">Subscriptions</a>
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 break-words" id="pageTitle">Subscription</h2>
                    </div>
                    <button type="button" id="cancelBtn" class="hidden self-start sm:self-auto shrink-0 px-4 py-2 text-sm text-red-700 border border-red-200 rounded-lg hover:bg-red-50">Cancel plan</button>
                </div>
            </header>
            <div class="p-4 sm:p-6 max-w-3xl">
                <p id="pageError" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm"></p>
                <form id="assignForm" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 space-y-4">
                    <label class="block text-sm">User email
                        <input id="assignEmail" type="email" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </label>
                    <label class="block text-sm">Plan
                        <select id="assignTier" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="free">Free</option>
                            <option value="basic">Basic ($4.99/mo)</option>
                            <option value="premium">Premium ($49.99/mo)</option>
                        </select>
                    </label>
                    <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Assign plan</button>
                </form>
                <form id="editForm" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm" id="facts"></div>
                    <label class="block text-sm">Plan
                        <select id="tier" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="free">Free</option>
                            <option value="basic">Basic</option>
                            <option value="premium">Premium</option>
                        </select>
                    </label>
                    <label class="flex items-center gap-2 text-sm">
                        <input id="active" type="checkbox" class="rounded">
                        Account active
                    </label>
                    <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
                </form>
            </div>
        </main>
    </div>
    <script src="/admin/assets/js/admin-sidebar.js?v=4"></script>
    <script src="/assets/js/main.js?v=1.3"></script>
    <script>
        if (!CVision.Utils.isAuthenticated()) window.location.href = 'login.html';
        const userId = new URLSearchParams(window.location.search).get('id');

        function showError(error) {
            const box = document.getElementById('pageError');
            box.textContent = error.detail || error.message || 'Something went wrong';
            box.classList.remove('hidden');
        }

        function line(label, value) {
            return `<div><div class="text-xs uppercase tracking-wide text-gray-400">${label}</div><div class="text-gray-900 mt-1">${value || '—'}</div></div>`;
        }

        async function loadSubscription() {
            const user = await CVision.API.request(`/admin/users/${userId}`);
            document.getElementById('pageTitle').textContent = user.email || 'Subscription';
            document.getElementById('tier').value = user.subscription_tier || 'free';
            document.getElementById('active').checked = !!user.is_active;
            const billing = user.subscription
                ? `${user.subscription.plan_id || 'Plan'} · ${user.subscription.status || ''} · ${user.subscription.billing_interval || ''}`
                : 'No billing record';
            document.getElementById('facts').innerHTML = [
                line('Name', `${user.first_name || ''} ${user.last_name || ''}`.trim()),
                line('Email', user.email),
                line('Billing', billing),
                line('Joined', user.created_at ? new Date(user.created_at).toLocaleDateString() : '')
            ].join('');
        }

        document.getElementById('assignForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('assignEmail').value.trim();
            try {
                const response = await CVision.API.request(`/admin/users?search=${encodeURIComponent(email)}&limit=5`);
                const user = (response.users || []).find((item) => (item.email || '').toLowerCase() === email.toLowerCase());
                if (!user) throw new Error('No user with that email');
                await CVision.API.request(`/admin/users/${user.id}/tier`, {
                    method: 'PATCH',
                    body: JSON.stringify({ tier: document.getElementById('assignTier').value })
                });
                window.location.href = `subscription.html?id=${encodeURIComponent(user.id)}`;
            } catch (error) {
                showError(error);
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            try {
                await CVision.API.request(`/admin/users/${userId}/tier`, {
                    method: 'PATCH',
                    body: JSON.stringify({ tier: document.getElementById('tier').value })
                });
                await CVision.API.request(`/admin/users/${userId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_active: document.getElementById('active').checked })
                });
                await loadSubscription();
            } catch (error) {
                showError(error);
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', async () => {
            if (!confirm('Move this account to the Free plan?')) return;
            try {
                await CVision.API.request(`/admin/users/${userId}/tier`, {
                    method: 'PATCH',
                    body: JSON.stringify({ tier: 'free' })
                });
                await loadSubscription();
            } catch (error) {
                showError(error);
            }
        });

        if (!userId) {
            document.getElementById('pageTitle').textContent = 'Assign plan';
            document.getElementById('assignForm').classList.remove('hidden');
        } else {
            document.getElementById('editForm').classList.remove('hidden');
            document.getElementById('cancelBtn').classList.remove('hidden');
            loadSubscription().catch(showError);
        }
    </script>
</body>

</html>
