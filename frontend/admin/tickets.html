<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - JobsApply admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div id="admin-sidebar"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-gray-900">Inbox</h2>
                    <div class="flex items-center space-x-4">
                        <a href="ticket.html" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">New message</a>
                        <span class="text-sm text-gray-600" id="adminName">Admin</span>
                        <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-900">Logout</button>
                    </div>
                </div>
            </header>

            <div class="p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-600">Conversations</p>
                        <p class="text-3xl font-bold text-gray-900 mt-2" id="inboxTotal">0</p>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-600">Needs reply</p>
                        <p class="text-3xl font-bold text-amber-700 mt-2" id="inboxWaiting">0</p>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-600">Open</p>
                        <p class="text-3xl font-bold text-gray-900 mt-2" id="inboxOpen">0</p>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-600">Resolved</p>
                        <p class="text-3xl font-bold text-gray-900 mt-2" id="inboxResolved">0</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="text-lg font-semibold">User messages</h3>
                        <button onclick="loadTickets()"
                            class="text-blue-600 hover:text-blue-800 text-sm font-medium">Refresh</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">User</th>
                                    <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Latest</th>
                                    <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsTableBody" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/assets/js/admin-sidebar.js?v=4"></script>
    <script src="/assets/js/main.js?v=1.3"></script>
    <script>
        // Check authentication
        if (!CVision.Utils.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        let tickets = [];

        function ticketMessages(ticket) {
            if (ticket.messages && ticket.messages.length) return ticket.messages;
            if (ticket.message) return [{ sender: 'user', body: ticket.message, created_at: ticket.created_at }];
            return [];
        }

        function renderStats() {
            const waiting = tickets.filter((ticket) => {
                const latest = ticketMessages(ticket).slice(-1)[0];
                return ticket.status !== 'resolved' && latest && latest.sender !== 'admin';
            }).length;
            const resolved = tickets.filter((ticket) => ticket.status === 'resolved').length;
            document.getElementById('inboxTotal').textContent = tickets.length;
            document.getElementById('inboxWaiting').textContent = waiting;
            document.getElementById('inboxOpen').textContent = tickets.length - resolved;
            document.getElementById('inboxResolved').textContent = resolved;
        }

        function renderTable() {
            renderStats();
            const tableBody = document.getElementById('ticketsTableBody');
            if (!tickets.length) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">No messages yet.</td></tr>`;
                return;
            }
            tableBody.innerHTML = tickets.map((ticket) => {
                const messages = ticketMessages(ticket);
                const latest = messages[messages.length - 1] || {};
                const waiting = latest.sender !== 'admin';
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm text-gray-900">${escapeHtml(ticket.email || 'User')}</td>
                        <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate">${escapeHtml(latest.body || '')}</td>
                        <td class="px-6 py-4 text-xs font-medium ${waiting ? 'text-amber-700' : 'text-gray-500'}">${waiting ? 'Needs reply' : escapeHtml(ticket.status || '')}</td>
                        <td class="px-6 py-4 text-sm"><a class="text-blue-600 hover:text-blue-800" href="ticket.html?id=${encodeURIComponent(ticket.id)}">Details</a></td>
                    </tr>
                `;
            }).join('');
        }

        async function loadTickets() {
            const payload = await CVision.API.request('/admin/support-tickets');
            tickets = (payload && payload.tickets) || [];
            renderTable();
        }

        loadTickets();
    </script>
</body>

</html>
