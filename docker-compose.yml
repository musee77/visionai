services:
  mongo:
    image: mongo:7.0
    container_name: synovae_db_mongo
    environment:
      MONGO_INITDB_DATABASE: synovae_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - vision_ai_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet mongodb://localhost:27017/synovae_db --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vision_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vision_ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  automation:
    build:
      context: ./browser-automation
      dockerfile: Dockerfile
    container_name: vision_ai_automation
    hostname: automation
    environment:
      - PORT=3001
      - BROWSER_AUTOMATION_TOKEN=${BROWSER_AUTOMATION_TOKEN:-dev-automation-token}
      - HEADLESS=true
    volumes:
      - ./browser-automation:/app
      - ./uploads:/app/uploads
      - /app/node_modules
      - /dev/shm:/dev/shm
    networks:
      - vision_ai_network
    restart: unless-stopped
    ports:
      - "3001:3001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_ai_backend
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BROWSER_AUTOMATION_URL=${BROWSER_AUTOMATION_URL:-http://automation:3001}
      - MONGODB_URL=${MONGODB_URL}
      - BROWSER_AUTOMATION_TOKEN=${BROWSER_AUTOMATION_TOKEN}
      - DATABASE_NAME=${DATABASE_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./frontend:/app/frontend
    ports:
      - 8000:8000
    networks:
      - vision_ai_network
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
      automation:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_ai_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://mongo:27017/synovae_db
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_AUTOMATION_URL=${BROWSER_AUTOMATION_URL:-http://automation:3001}
      - BROWSER_AUTOMATION_TOKEN=${BROWSER_AUTOMATION_TOKEN}
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_NAME=${DATABASE_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - backend
      - mongo
      - automation
    networks:
      - vision_ai_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_ai_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://mongo:27017/synovae_db
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      - redis
      - mongo
    networks:
      - vision_ai_network

  nginx:
    image: nginx:alpine
    container_name: vision_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - vision_ai_network

volumes:
  mongo_data:
  redis_data:

networks:
  vision_ai_network:
    driver: bridge
